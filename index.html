<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P&L Calendar Journal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      background: #0f1420;
      color: #e8eef7;
      min-height: 100vh;
      padding: 22px;
    }

    .container {
      max-width: 1250px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -0.5px;
    }

    .month-pnl {
      font-size: 26px;
      font-weight: 900;
      margin-top: 6px;
    }

    .green { color: #14d8a6; }
    .red { color: #ff5f7e; }

    .btn {
      background: #14d8a6;
      color: #06110e;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: #171d2b;
      border: 1px solid #252f45;
      border-radius: 16px;
      padding: 18px;
    }

    .label {
      color: #8f9bad;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 28px;
      font-weight: 900;
    }

    .calendar-head {
      background: #171d2b;
      border: 1px solid #252f45;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .month-title {
      font-size: 22px;
      font-weight: 900;
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav button {
      background: #222b3f;
      color: white;
      border: 1px solid #33405a;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .weekday {
      text-align: center;
      color: #8f9bad;
      font-size: 13px;
      padding: 10px;
      font-weight: 800;
    }

    .day {
      min-height: 130px;
      background: #171d2b;
      border: 1px solid #252f45;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .day:hover {
      border-color: #14d8a6;
    }

    .day.win {
      background: #08786f;
    }

    .day.loss {
      background: #a94463;
    }

    .day-num {
      text-align: right;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .muted {
      opacity: 0.35;
    }

    .day-pnl {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .day-trades {
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      background: #14d8a6;
      color: #06110e;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 900;
      margin-top: 7px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      background: #171d2b;
      border: 1px solid #33405a;
      border-radius: 18px;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close {
      background: none;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input, select {
      width: 100%;
      background: #0f1420;
      color: white;
      border: 1px solid #33405a;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .save {
      background: #14d8a6;
      color: #06110e;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .trade-list {
      margin-top: 16px;
      border-top: 1px solid #33405a;
      padding-top: 12px;
      max-height: 190px;
      overflow: auto;
    }

    .trade {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #252f45;
      font-size: 14px;
    }

    .delete {
      background: #ff5f7e;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 5px 8px;
      cursor: pointer;
    }

    @media (max-width: 850px) {
      body {
        padding: 12px;
      }

      .top, .calendar-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .dashboard {
        grid-template-columns: 1fr 1fr;
      }

      .calendar {
        grid-template-columns: 1fr;
      }

      .weekday {
        display: none;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top">
      <div>
        <h1>P&L Calendar Journal</h1>
        <div id="monthPnl" class="month-pnl">$0.00 / 0%</div>
      </div>
      <button class="btn" onclick="openModal()">Add Trade</button>
    </div>

    <section class="dashboard">
      <div class="card">
        <div class="label">Total P&L</div>
        <div id="totalPnl" class="value">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Month P&L</div>
        <div id="dashMonthPnl" class="value">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Win Rate</div>
        <div id="winRate" class="value">0%</div>
      </div>
      <div class="card">
        <div class="label">Trades This Month</div>
        <div id="monthTrades" class="value">0</div>
      </div>
    </section>

    <div class="calendar-head">
      <div id="monthTitle" class="month-title"></div>
      <div class="nav">
        <button onclick="changeMonth(-1)">←</button>
        <button onclick="goToday()">Today</button>
        <button onclick="changeMonth(1)">→</button>
      </div>
    </div>

    <div class="calendar" id="calendar"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Add Trade</h2>
        <button class="close" onclick="closeModal()">×</button>
      </div>

      <form id="tradeForm" class="form">
        <div class="row">
          <input id="date" type="date" required>
          <input id="ticker" type="text" placeholder="Ticker ex: PLTR" required>
        </div>

        <div class="row">
          <input id="entry" type="number" step="0.01" placeholder="Entry price" required>
          <input id="exit" type="number" step="0.01" placeholder="Exit price" required>
        </div>

        <div class="row">
          <input id="qty" type="number" step="0.01" placeholder="Shares/contracts" required>
          <select id="type">
            <option value="stock">Stock</option>
            <option value="option">Option</option>
          </select>
        </div>

        <select id="side">
          <option value="long">Long</option>
          <option value="short">Short</option>
        </select>

        <input id="tag" type="text" placeholder="Setup/tag ex: Breakout, FOMO, Reversal">
        <input id="notes" type="text" placeholder="Notes">

        <button class="save" type="submit">Save Trade</button>
      </form>

      <div id="tradeList" class="trade-list"></div>
    </div>
  </div>

  <script>
    let trades = JSON.parse(localStorage.getItem("trades")) || [];
    let viewDate = new Date();
    let selectedDate = null;

    const calendar = document.getElementById("calendar");

    function saveTrades() {
      localStorage.setItem("trades", JSON.stringify(trades));
    }

    function money(n) {
      return n.toLocaleString("en-US", {
        style: "currency",
        currency: "USD"
      });
    }

    function dateKey(d) {
      return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    function calculatePnl(t) {
      let pnl;

      if (t.side === "long") {
        pnl = (t.exit - t.entry) * t.qty;
      } else {
        pnl = (t.entry - t.exit) * t.qty;
      }

      if (t.type === "option") pnl *= 100;

      return pnl;
    }

    function calculatePercent(t) {
      let cost = t.entry * t.qty;
      if (t.type === "option") cost *= 100;
      if (cost === 0) return 0;
      return (t.pnl / cost) * 100;
    }

    function render() {
      renderCalendar();
      renderStats();
    }

    function renderStats() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      const monthTradesArr = trades.filter(t => {
        const d = new Date(t.date + "T00:00:00");
        return d.getFullYear() === year && d.getMonth() === month;
      });

      const totalPnl = trades.reduce((s, t) => s + t.pnl, 0);
      const monthPnl = monthTradesArr.reduce((s, t) => s + t.pnl, 0);
      const monthCost = monthTradesArr.reduce((s, t) => {
        let cost = t.entry * t.qty;
        if (t.type === "option") cost *= 100;
        return s + cost;
      }, 0);

      const monthPercent = monthCost ? (monthPnl / monthCost) * 100 : 0;
      const wins = monthTradesArr.filter(t => t.pnl > 0).length;
      const winRate = monthTradesArr.length ? Math.round((wins / monthTradesArr.length) * 100) : 0;

      totalPnlEl = document.getElementById("totalPnl");
      dashMonthPnlEl = document.getElementById("dashMonthPnl");
      monthPnlEl = document.getElementById("monthPnl");

      totalPnlEl.textContent = money(totalPnl);
      totalPnlEl.className = "value " + (totalPnl >= 0 ? "green" : "red");

      dashMonthPnlEl.textContent = money(monthPnl);
      dashMonthPnlEl.className = "value " + (monthPnl >= 0 ? "green" : "red");

      monthPnlEl.textContent = `${money(monthPnl)} / ${monthPercent.toFixed(2)}%`;
      monthPnlEl.className = "month-pnl " + (monthPnl >= 0 ? "green" : "red");

      document.getElementById("winRate").textContent = winRate + "%";
      document.getElementById("monthTrades").textContent = monthTradesArr.length;
    }

    function renderCalendar() {
      calendar.innerHTML = "";

      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      weekdays.forEach(day => {
        const el = document.createElement("div");
        el.className = "weekday";
        el.textContent = day;
        calendar.appendChild(el);
      });

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      document.getElementById("monthTitle").textContent =
        viewDate.toLocaleString("default", { month: "long" }) + " " + year;

      const firstDay = new Date(year, month, 1);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      for (let i = 0; i < 42; i++) {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);

        const key = dateKey(d);
        const dayTrades = trades.filter(t => t.date === key);
        const pnl = dayTrades.reduce((s, t) => s + t.pnl, 0);

        const day = document.createElement("div");
        day.className =
          "day " +
          (pnl > 0 ? "win" : pnl < 0 ? "loss" : "") +
          (d.getMonth() !== month ? " muted" : "");

        day.onclick = () => openModal(key);

        const firstTag = dayTrades.find(t => t.tag)?.tag || "";

        day.innerHTML = `
          <div class="day-num">${d.getDate()}</div>
          ${
            dayTrades.length
              ? `
                <div class="day-pnl">${money(pnl)}</div>
                <div class="day-trades">${dayTrades.length} Trade${dayTrades.length > 1 ? "s" : ""}</div>
                ${firstTag ? `<span class="tag">${firstTag.toUpperCase()}</span>` : ""}
              `
              : ""
          }
        `;

        calendar.appendChild(day);
      }
    }

    function openModal(date = dateKey(new Date())) {
      selectedDate = date;
      document.getElementById("date").value = selectedDate;
      document.getElementById("modalTitle").textContent = "Add Trade - " + selectedDate;
      document.getElementById("modal").classList.add("show");
      renderTradeList();
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("show");
    }

    document.getElementById("tradeForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const trade = {
        id: Date.now(),
        date: document.getElementById("date").value,
        ticker: document.getElementById("ticker").value.toUpperCase(),
        entry: Number(document.getElementById("entry").value),
        exit: Number(document.getElementById("exit").value),
        qty: Number(document.getElementById("qty").value),
        type: document.getElementById("type").value,
        side: document.getElementById("side").value,
        tag: document.getElementById("tag").value,
        notes: document.getElementById("notes").value
      };

      trade.pnl = calculatePnl(trade);
      trade.percent = calculatePercent(trade);

      trades.push(trade);
      saveTrades();

      this.reset();
      document.getElementById("date").value = selectedDate;

      render();
      renderTradeList();
    });

    function renderTradeList() {
      const list = document.getElementById("tradeList");
      const dayTrades = trades.filter(t => t.date === selectedDate);

      if (!dayTrades.length) {
        list.innerHTML = `<p style="color:#8f9bad;">No trades for this day yet.</p>`;
        return;
      }

      list.innerHTML = dayTrades.map(t => `
        <div class="trade">
          <div>
            <strong>${t.ticker}</strong> —
            <span class="${t.pnl >= 0 ? "green" : "red"}">${money(t.pnl)}</span>
            / ${t.percent.toFixed(2)}%
            <br>
            <span style="color:#8f9bad;">${t.tag || ""} ${t.notes ? "— " + t.notes : ""}</span>
          </div>
          <button class="delete" onclick="deleteTrade(${t.id})">X</button>
        </div>
      `).join("");
    }

    function deleteTrade(id) {
      trades = trades.filter(t => t.id !== id);
      saveTrades();
      render();
      renderTradeList();
    }

    function changeMonth(amount) {
      viewDate.setMonth(viewDate.getMonth() + amount);
      render();
    }

    function goToday() {
      viewDate = new Date();
      render();
    }

    render();
  </script>
</body>
</html>
