<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P&L Journal</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
    body{background:#0f1420;color:#e8eef7;min-height:100vh;padding:22px}
    .container{max-width:1250px;margin:auto}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
    h1{font-size:30px}
    .month-pnl{font-size:25px;font-weight:900;margin-top:6px}
    .green{color:#14d8a6}.red{color:#ff5f7e}
    .btn{background:#14d8a6;color:#06110e;border:none;padding:12px 18px;border-radius:10px;font-weight:900;cursor:pointer}
    .dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .card{background:#171d2b;border:1px solid #252f45;border-radius:16px;padding:18px}
    .label{color:#8f9bad;font-size:14px;margin-bottom:8px}
    .value{font-size:28px;font-weight:900}
    .calendar-head{background:#171d2b;border:1px solid #252f45;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .month-title{font-size:22px;font-weight:900}
    .nav{display:flex;gap:8px}
    .nav button{background:#222b3f;color:white;border:1px solid #33405a;padding:9px 14px;border-radius:8px;cursor:pointer}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .weekday{text-align:center;color:#8f9bad;font-size:13px;padding:10px;font-weight:800}
    .day{min-height:125px;background:#171d2b;border:1px solid #252f45;border-radius:10px;padding:10px;cursor:pointer}
    .day:hover{border-color:#14d8a6}
    .day.win{background:#08786f}.day.loss{background:#a94463}
    .day-num{text-align:right;font-size:13px;color:#cbd5e1;margin-bottom:18px}
    .muted{opacity:.35}
    .day-pnl{font-size:17px;font-weight:900;margin-bottom:4px}
    .day-trades{font-size:14px}
    .tag{display:inline-block;background:#14d8a6;color:#06110e;padding:3px 6px;border-radius:5px;font-size:10px;font-weight:900;margin-top:7px}
    .trades-table{margin-top:18px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;background:#171d2b;border:1px solid #252f45;border-radius:16px;overflow:hidden}
    th,td{text-align:left;padding:12px;border-bottom:1px solid #252f45;font-size:14px}
    th{color:#8f9bad}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:20;padding:16px}
    .modal.show{display:flex}
    .modal-card{width:100%;max-width:600px;background:#171d2b;border:1px solid #33405a;border-radius:18px;padding:20px}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .close{background:none;border:none;color:white;font-size:26px;cursor:pointer}
    .trade-list{margin-top:12px;max-height:330px;overflow:auto}
    .trade{padding:10px 0;border-bottom:1px solid #252f45;font-size:14px}
    @media(max-width:850px){body{padding:12px}.top,.calendar-head{flex-direction:column;align-items:flex-start}.dashboard{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr}.weekday{display:none}}
  </style>
</head>

<body>
<div class="container">
  <div class="top">
    <div>
      <h1>P&L Calendar Journal</h1>
      <div id="monthPnl" class="month-pnl">$0.00 / 0%</div>
    </div>
  </div>

  <section class="dashboard">
    <div class="card"><div class="label">Total P&L</div><div id="totalPnl" class="value">$0.00</div></div>
    <div class="card"><div class="label">Month P&L</div><div id="dashMonthPnl" class="value">$0.00</div></div>
    <div class="card"><div class="label">Win Rate</div><div id="winRate" class="value">0%</div></div>
    <div class="card"><div class="label">Trades This Month</div><div id="monthTrades" class="value">0</div></div>
  </section>

  <div class="calendar-head">
    <div id="monthTitle" class="month-title"></div>
    <div class="nav">
      <button onclick="changeMonth(-1)">←</button>
      <button onclick="goToday()">Today</button>
      <button onclick="changeMonth(1)">→</button>
    </div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="trades-table">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Stock</th>
          <th>Contract</th>
          <th>Expires</th>
          <th>Entry</th>
          <th>Exit</th>
          <th>P&L</th>
        </tr>
      </thead>
      <tbody id="tradeTable"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Trades</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="tradeList" class="trade-list"></div>
  </div>
</div>

<script>
const trades = [
  {date:"2025-04-27",stock:"GOOGL",contract:"$350 Call",expires:"2025-04-27",entry:168,exit:264},
  {date:"2025-04-27",stock:"NVDA",contract:"$212.5 Call",expires:"2025-04-27",entry:40,exit:40},
  {date:"2025-04-28",stock:"PYPL",contract:"$52 Call",expires:"2025-05-01",entry:110,exit:36},
  {date:"2025-04-28",stock:"AAPL",contract:"$275 Call",expires:"2025-04-29",entry:366,exit:379},
  {date:"2025-04-30",stock:"TSLA",contract:"$380 Call",expires:"2025-05-01",entry:525,exit:630},
  {date:"2025-04-30",stock:"HPE",contract:"$30 Call",expires:"2025-05-15",entry:98,exit:122},
  {date:"2025-05-01",stock:"MSFT",contract:"$420 Call",expires:"2025-05-01",entry:629,exit:112},
  {date:"2025-05-04",stock:"AMZN",contract:"$275 Call",expires:"2025-05-04",entry:215,exit:715},
  {date:"2025-05-06",stock:"NVDA",contract:"$207.5 Call",expires:"2025-05-06",entry:675,exit:1080},
  {date:"2025-05-06",stock:"NVDA",contract:"$210 Call",expires:"2025-05-06",entry:90,exit:40},
  {date:"2025-05-07",stock:"AAPL",contract:"$295 Call",expires:"2025-05-08",entry:1180,exit:629},
  {date:"2025-05-07",stock:"APLD",contract:"$45 Call",expires:"2025-06-18",entry:470,exit:530},
  {date:"2025-05-11",stock:"PLTR",contract:"$90 Call",expires:"2025-05-15",entry:200,exit:800},
  {date:"2025-05-12",stock:"HL",contract:"$18.5 Put",expires:"2025-05-15",entry:45,exit:81}
].map(t => ({...t, pnl:t.exit - t.entry, percent:((t.exit - t.entry) / t.entry) * 100}));

let viewDate = new Date("2025-05-01");
let selectedDate = null;

const calendar = document.getElementById("calendar");

function money(n){
  return n.toLocaleString("en-US",{style:"currency",currency:"USD"});
}

function dateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function render(){
  renderCalendar();
  renderStats();
  renderTable();
}

function renderStats(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();

  const monthTradesArr = trades.filter(t=>{
    const d = new Date(t.date+"T00:00:00");
    return d.getFullYear()===year && d.getMonth()===month;
  });

  const totalPnl = trades.reduce((s,t)=>s+t.pnl,0);
  const monthPnl = monthTradesArr.reduce((s,t)=>s+t.pnl,0);
  const monthEntry = monthTradesArr.reduce((s,t)=>s+t.entry,0);
  const monthPercent = monthEntry ? (monthPnl / monthEntry) * 100 : 0;
  const wins = monthTradesArr.filter(t=>t.pnl>0).length;
  const winRate = monthTradesArr.length ? Math.round((wins/monthTradesArr.length)*100) : 0;

  totalPnl.textContent;
  document.getElementById("totalPnl").textContent = money(totalPnl);
  document.getElementById("totalPnl").className = "value " + (totalPnl >= 0 ? "green":"red");

  document.getElementById("dashMonthPnl").textContent = money(monthPnl);
  document.getElementById("dashMonthPnl").className = "value " + (monthPnl >= 0 ? "green":"red");

  document.getElementById("monthPnl").textContent = `${money(monthPnl)} / ${monthPercent.toFixed(2)}%`;
  document.getElementById("monthPnl").className = "month-pnl " + (monthPnl >= 0 ? "green":"red");

  document.getElementById("winRate").textContent = winRate + "%";
  document.getElementById("monthTrades").textContent = monthTradesArr.length;
}

function renderCalendar(){
  calendar.innerHTML = "";

  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(day=>{
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = day;
    calendar.appendChild(el);
  });

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();

  document.getElementById("monthTitle").textContent =
    viewDate.toLocaleString("default",{month:"long"})+" "+year;

  const firstDay = new Date(year,month,1);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate()-firstDay.getDay());

  for(let i=0;i<42;i++){
    const d = new Date(startDate);
    d.setDate(startDate.getDate()+i);

    const key = dateKey(d);
    const dayTrades = trades.filter(t=>t.date===key);
    const pnl = dayTrades.reduce((s,t)=>s+t.pnl,0);

    const day = document.createElement("div");
    day.className = "day " + (pnl>0?"win":pnl<0?"loss":"") + (d.getMonth()!==month?" muted":"");
    day.onclick = () => openModal(key);

    day.innerHTML = `
      <div class="day-num">${d.getDate()}</div>
      ${dayTrades.length ? `
        <div class="day-pnl">${money(pnl)}</div>
        <div class="day-trades">${dayTrades.length} Trade${dayTrades.length>1?"s":""}</div>
        <span class="tag">${dayTrades[0].stock}</span>
      ` : ""}
    `;

    calendar.appendChild(day);
  }
}

function renderTable(){
  document.getElementById("tradeTable").innerHTML = trades.map(t=>`
    <tr>
      <td>${t.date}</td>
      <td><strong>${t.stock}</strong></td>
      <td>${t.contract}</td>
      <td>${t.expires}</td>
      <td>${money(t.entry)}</td>
      <td>${money(t.exit)}</td>
      <td class="${t.pnl>=0?"green":"red"}"><strong>${money(t.pnl)} / ${t.percent.toFixed(2)}%</strong></td>
    </tr>
  `).join("");
}

function openModal(date){
  selectedDate = date;
  const dayTrades = trades.filter(t=>t.date===selectedDate);

  document.getElementById("modalTitle").textContent = "Trades - " + selectedDate;
  document.getElementById("tradeList").innerHTML = dayTrades.length ? dayTrades.map(t=>`
    <div class="trade">
      <strong>${t.stock} ${t.contract}</strong><br>
      Expires: ${t.expires}<br>
      Entry: ${money(t.entry)} | Exit: ${money(t.exit)}<br>
      P&L: <span class="${t.pnl>=0?"green":"red"}">${money(t.pnl)} / ${t.percent.toFixed(2)}%</span>
    </div>
  `).join("") : `<p style="color:#8f9bad;">No trades for this day.</p>`;

  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function changeMonth(amount){
  viewDate.setMonth(viewDate.getMonth()+amount);
  render();
}

function goToday(){
  viewDate = new Date("2025-05-01");
  render();
}

render();
</script>
</body>
</html>
