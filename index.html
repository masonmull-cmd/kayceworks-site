<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P&L Calendar Journal</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:
    linear-gradient(rgba(10,15,25,.72), rgba(10,15,25,.78)),
    url("https://imgur.com/a/PGmdXDA");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#e8eef7;
  min-height:100vh;
  padding:22px;
}

.container{
  max-width:1300px;
  margin:auto;
}

h1{
  font-size:42px;
  font-weight:900;
  letter-spacing:-1px;
}

.month-pnl{
  margin-top:8px;
  font-size:34px;
  font-weight:900;
}

.green{
  color:#14d8a6;
}

.red{
  color:#ff5f7e;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin:24px 0;
}

.card,
.calendar-head,
.day,
table,
.modal-card{
  background:rgba(20,25,38,.48);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.card{
  border-radius:22px;
  padding:22px;
}

.label{
  color:#b8c0d4;
  font-size:15px;
  margin-bottom:10px;
}

.value{
  font-size:38px;
  font-weight:900;
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:22px;
  padding:18px 22px;
  margin-bottom:12px;
}

.month-title{
  font-size:32px;
  font-weight:900;
}

.nav{
  display:flex;
  gap:10px;
}

.nav button{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

.nav button:hover{
  background:rgba(255,255,255,.14);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekday{
  text-align:center;
  padding:10px;
  font-size:14px;
  color:#d2d9e6;
  font-weight:800;
}

.day{
  min-height:145px;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  transition:.2s;
}

.day:hover{
  transform:scale(1.02);
}

.day.win{
  background:rgba(20,216,166,.18);
  border:1px solid rgba(20,216,166,.45);
}

.day.loss{
  background:rgba(255,95,126,.18);
  border:1px solid rgba(255,95,126,.4);
}

.day-num{
  text-align:right;
  font-size:15px;
  margin-bottom:18px;
  color:white;
  font-weight:700;
}

.day-pnl{
  font-size:18px;
  font-weight:900;
  margin-bottom:5px;
}

.day-trades{
  font-size:14px;
  color:#d4d9e5;
}

.tag{
  display:inline-block;
  margin-top:8px;
  padding:5px 8px;
  border-radius:8px;
  background:#14d8a6;
  color:#07110e;
  font-size:11px;
  font-weight:900;
}

.trades-table{
  margin-top:24px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  border-radius:22px;
  overflow:hidden;
}

th,td{
  padding:16px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,.08);
}

th{
  color:#b8c0d4;
  font-size:14px;
}

td{
  font-size:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  justify-content:center;
  align-items:center;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:95%;
  max-width:650px;
  border-radius:22px;
  padding:24px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.trade{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
  line-height:1.7;
}

@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .calendar{
    grid-template-columns:1fr;
  }

  .weekday{
    display:none;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>P&L Calendar Journal</h1>
<div id="monthPnl" class="month-pnl">$0.00 / 0%</div>

<section class="dashboard">

<div class="card">
  <div class="label">Total P&L</div>
  <div id="totalPnl" class="value">$0.00</div>
</div>

<div class="card">
  <div class="label">Month P&L</div>
  <div id="dashMonthPnl" class="value">$0.00</div>
</div>

<div class="card">
  <div class="label">Win Rate</div>
  <div id="winRate" class="value">0%</div>
</div>

<div class="card">
  <div class="label">Trades This Month</div>
  <div id="monthTrades" class="value">0</div>
</div>

</section>

<div class="calendar-head">

<div id="monthTitle" class="month-title"></div>

<div class="nav">
  <button onclick="changeMonth(-1)">←</button>
  <button onclick="goToday()">Today</button>
  <button onclick="changeMonth(1)">→</button>
</div>

</div>

<div class="calendar" id="calendar"></div>

<div class="trades-table">

<table>

<thead>
<tr>
<th>Exit Date</th>
<th>Stock</th>
<th>Contract</th>
<th>Expires</th>
<th>Contracts</th>
<th>Entry</th>
<th>Exit</th>
<th>P&L</th>
</tr>
</thead>

<tbody id="tradeTable"></tbody>

</table>

</div>

</div>

</html>
