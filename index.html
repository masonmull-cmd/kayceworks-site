<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P&L Calendar Journal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:linear-gradient(rgba(10,15,25,.48),rgba(10,15,25,.58)),url("https://cdn.discordapp.com/attachments/864511785838182410/1504606086081286155/IMG_5684.jpg?ex=6a07991d&is=6a06479d&hm=0d9b9101e30085c5bccfd7129478ee550c210ea0cb50fc1ba572f81e87a4ac46&");background-size:cover;background-position:center;background-attachment:fixed;color:#e8eef7;min-height:100vh;padding:22px}
.container{max-width:1300px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:42px;font-weight:900}.month-pnl{margin-top:8px;font-size:34px;font-weight:900}
.green{color:#14d8a6}.red{color:#ff5f7e}
.top-buttons{display:flex;gap:10px}.btn,.nav button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:white;padding:12px 18px;border-radius:12px;cursor:pointer}.btn.active{background:#14d8a6;color:#07110e;font-weight:900}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}
.card,.calendar-head,.day,table,.modal-card,.crypto-card{background:rgba(20,25,38,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card{border-radius:22px;padding:22px}.label{color:#b8c0d4;font-size:15px;margin-bottom:10px}.value{font-size:38px;font-weight:900}
.calendar-head{display:flex;justify-content:space-between;align-items:center;border-radius:22px;padding:18px 22px;margin-bottom:12px}.month-title{font-size:32px;font-weight:900}.nav{display:flex;gap:10px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;padding:10px;font-size:14px;color:#d2d9e6;font-weight:800}
.day{min-height:145px;border-radius:14px;padding:12px;cursor:pointer;transition:.2s}.day:hover{transform:scale(1.015)}
.day.win{background:rgba(20,216,166,.18);border:1px solid rgba(20,216,166,.45)}.day.loss{background:rgba(255,95,126,.18);border:1px solid rgba(255,95,126,.4)}
.day-num{text-align:right;font-size:15px;margin-bottom:18px;color:white;font-weight:700}.day-pnl{font-size:18px;font-weight:900;margin-bottom:5px}.day-trades{font-size:14px;color:#d4d9e5}.muted{opacity:.35}
.trades-table{margin-top:24px;overflow-x:auto}table{width:100%;border-collapse:collapse;border-radius:22px;overflow:hidden}th,td{padding:16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}th{color:#b8c0d4;font-size:14px}td{font-size:15px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:100;padding:16px}.modal.show{display:flex}.modal-card{width:95%;max-width:800px;border-radius:22px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:none;border:none;color:white;font-size:28px;cursor:pointer}.trade{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);line-height:1.7}
#cryptoView{display:none}.crypto-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0}.crypto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.crypto-card{border-radius:20px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;transition:.2s}.crypto-card:hover{transform:scale(1.015);border-color:#14d8a6}.coin-left{display:flex;align-items:center;gap:12px}.coin-left img{width:38px;height:38px}.coin-name{font-weight:900;font-size:18px}.coin-symbol{color:#b8c0d4;font-size:13px}.coin-price{text-align:right;font-size:18px;font-weight:900}.coin-move{font-size:14px;margin-top:5px}
#cryptoChart{max-height:360px}
@media(max-width:900px){.top{align-items:flex-start;flex-direction:column}.dashboard{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr}.weekday{display:none}.crypto-grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="container">
  <div class="top">
    <div>
      <h1>P&L Calendar Journal</h1>
      <div id="monthPnl" class="month-pnl">$0.00</div>
    </div>
    <div class="top-buttons">
      <button id="journalBtn" class="btn active" onclick="showJournal()">Journal</button>
      <button id="cryptoBtn" class="btn" onclick="showCrypto()">Crypto</button>
    </div>
  </div>

  <div id="journalView">
    <section class="dashboard">
      <div class="card"><div class="label">Total P&L</div><div id="totalPnl" class="value">$0.00</div></div>
      <div class="card"><div class="label">Month P&L</div><div id="dashMonthPnl" class="value">$0.00</div></div>
      <div class="card"><div class="label">Win Rate</div><div id="winRate" class="value">0%</div></div>
      <div class="card"><div class="label">Trades This Month</div><div id="monthTrades" class="value">0</div></div>
    </section>

    <div class="calendar-head">
      <div id="monthTitle" class="month-title"></div>
      <div class="nav">
        <button onclick="changeMonth(-1)">←</button>
        <button onclick="goToday()">Today</button>
        <button onclick="changeMonth(1)">→</button>
      </div>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="trades-table">
      <table>
        <thead><tr><th>Exit Date</th><th>Stock</th><th>Contract</th><th>Expires</th><th>Contracts</th><th>Entry</th><th>Exit</th><th>P&L</th></tr></thead>
        <tbody id="tradeTable"></tbody>
      </table>
    </div>
  </div>

  <div id="cryptoView">
    <div class="crypto-head">
      <h2 class="month-title">Top 10 Crypto</h2>
      <button class="btn" onclick="loadCrypto()">Refresh</button>
    </div>
    <div id="cryptoStatus" class="card">Loading crypto prices...</div>
    <div class="crypto-grid" id="cryptoGrid"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Trades</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="tradeList"></div>
  </div>
</div>

<div class="modal" id="cryptoChartModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="cryptoChartTitle">Crypto Chart</h2>
      <button class="close" onclick="closeCryptoChart()">×</button>
    </div>
    <canvas id="cryptoChart"></canvas>
  </div>
</div>

<script>
const trades=[
{exitDate:"2026-04-27",stock:"GOOGL",contract:"$350 Call",expires:"2026-04-27",contracts:3,entry:168.12,exit:263.86},
{exitDate:"2026-04-27",stock:"NVDA",contract:"$212.5 Call",expires:"2026-04-27",contracts:2,entry:40.08,exit:39.90},
{exitDate:"2026-04-28",stock:"AAPL",contract:"$275 Call",expires:"2026-04-29",contracts:5,entry:366.20,exit:378.74},
{exitDate:"2026-04-29",stock:"PYPL",contract:"$52 Call",expires:"2026-05-01",contracts:4,entry:110.16,exit:35.82},
{exitDate:"2026-04-30",stock:"TSLA",contract:"$380 Call",expires:"2026-05-01",contracts:3,entry:525.12,exit:629.84},
{exitDate:"2026-05-01",stock:"HPE",contract:"$30 Call",expires:"2026-05-15",contracts:2,entry:98.08,exit:121.90},
{exitDate:"2026-05-01",stock:"MSFT",contract:"$420 Call",expires:"2026-05-01",contracts:8,entry:629.32,exit:111.64},
{exitDate:"2026-05-04",stock:"AMZN",contract:"$275 Call",expires:"2026-05-04",contracts:5,entry:215.20,exit:714.76},
{exitDate:"2026-05-05",stock:"TSLA",contract:"$410 Call",expires:"2026-05-06",contracts:3,entry:450.12,exit:617.85},
{exitDate:"2026-05-05",stock:"QQQ",contract:"$679 Put",expires:"2026-05-05",contracts:2,entry:132.08,exit:101.90},
{exitDate:"2026-05-05",stock:"TTD",contract:"$30 Call",expires:"2026-06-18",contracts:1,entry:108.04,exit:104.94},
{exitDate:"2026-05-06",stock:"NVDA",contract:"$207.5 Call",expires:"2026-05-06",contracts:15,entry:675.60,exit:1079.31},
{exitDate:"2026-05-06",stock:"NVDA",contract:"$210 Call",expires:"2026-05-06",contracts:3,entry:90.12,exit:39.84},
{exitDate:"2026-05-07",stock:"AAPL",contract:"$295 Call",expires:"2026-05-08",contracts:17,entry:1180.68,exit:628.21},
{exitDate:"2026-05-11",stock:"APLD",contract:"$45 Call",expires:"2026-06-18",contracts:1,entry:470.04,exit:529.93},
{exitDate:"2026-05-11",stock:"PLTR",contract:"$90 Call",expires:"2026-05-15",contracts:8,entry:200.32,exit:799.63},
{exitDate:"2026-05-12",stock:"HL",contract:"$18.5 Put",expires:"2026-05-15",contracts:3,entry:45.12,exit:80.86},
{exitDate:"2026-05-14",stock:"AVGO",contract:"$450 Call",expires:"2026-05-15",contracts:11,entry:1336.00,exit:1857.00}
].map(t=>({...t,pnl:t.exit-t.entry}));

let viewDate=new Date();
let cryptoChartInstance=null;

function money(n){return n.toLocaleString("en-US",{style:"currency",currency:"USD"});}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function render(){renderStats();renderCalendar();renderTable();}

function renderStats(){
  const y=viewDate.getFullYear(),m=viewDate.getMonth();
  const monthTradesArr=trades.filter(t=>{const d=new Date(t.exitDate+"T00:00:00");return d.getFullYear()===y&&d.getMonth()===m;});
  const totalPnl=trades.reduce((s,t)=>s+t.pnl,0);
  const monthPnl=monthTradesArr.reduce((s,t)=>s+t.pnl,0);
  const wins=trades.filter(t=>t.pnl>0).length;
  const winRate=Math.round((wins/trades.length)*100);
  document.getElementById("totalPnl").textContent=money(totalPnl);
  document.getElementById("totalPnl").className="value "+(totalPnl>=0?"green":"red");
  document.getElementById("dashMonthPnl").textContent=money(monthPnl);
  document.getElementById("dashMonthPnl").className="value "+(monthPnl>=0?"green":"red");
  document.getElementById("monthPnl").textContent=money(monthPnl);
  document.getElementById("monthPnl").className="month-pnl "+(monthPnl>=0?"green":"red");
  document.getElementById("winRate").textContent=winRate+"%";
  document.getElementById("monthTrades").textContent=monthTradesArr.length;
}

function renderCalendar(){
  const calendar=document.getElementById("calendar");
  calendar.innerHTML="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(day=>{
    const el=document.createElement("div");el.className="weekday";el.textContent=day;calendar.appendChild(el);
  });
  const y=viewDate.getFullYear(),m=viewDate.getMonth();
  document.getElementById("monthTitle").textContent=viewDate.toLocaleString("default",{month:"long"})+" "+y;
  const first=new Date(y,m,1),start=new Date(first);
  start.setDate(start.getDate()-first.getDay());
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const key=dateKey(d);
    const dayTrades=trades.filter(t=>t.exitDate===key);
    const pnl=dayTrades.reduce((s,t)=>s+t.pnl,0);
    const day=document.createElement("div");
    day.className="day "+(pnl>0?"win":pnl<0?"loss":"")+(d.getMonth()!==m?" muted":"");
    day.onclick=()=>openModal(key);
    day.innerHTML=`<div class="day-num">${d.getDate()}</div>${dayTrades.length?`<div class="day-pnl">${money(pnl)}</div><div class="day-trades">${dayTrades.length} Trade${dayTrades.length>1?"s":""}</div>`:""}`;
    calendar.appendChild(day);
  }
}

function renderTable(){
  document.getElementById("tradeTable").innerHTML=trades.map(t=>`
    <tr><td>${t.exitDate}</td><td><strong>${t.stock}</strong></td><td>${t.contract}</td><td>${t.expires}</td><td>${t.contracts}</td><td>${money(t.entry)}</td><td>${money(t.exit)}</td><td class="${t.pnl>=0?"green":"red"}"><strong>${money(t.pnl)}</strong></td></tr>
  `).join("");
}

function openModal(date){
  const dayTrades=trades.filter(t=>t.exitDate===date);
  document.getElementById("modalTitle").textContent="Trades - "+date;
  document.getElementById("tradeList").innerHTML=dayTrades.length?dayTrades.map(t=>`
    <div class="trade"><strong>${t.stock} ${t.contract}</strong><br>Expires: ${t.expires}<br>Contracts: ${t.contracts}<br>Entry: ${money(t.entry)}<br>Exit: ${money(t.exit)}<br>P&L: <span class="${t.pnl>=0?"green":"red"}">${money(t.pnl)}</span></div>
  `).join(""):`<p style="color:#b8c0d4;">No trades for this day.</p>`;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show");}
function changeMonth(n){viewDate.setMonth(viewDate.getMonth()+n);render();}
function goToday(){viewDate=new Date();render();}

function showJournal(){
  document.getElementById("journalView").style.display="block";
  document.getElementById("cryptoView").style.display="none";
  document.getElementById("journalBtn").classList.add("active");
  document.getElementById("cryptoBtn").classList.remove("active");
  document.getElementById("monthPnl").style.display="block";
}

async function showCrypto(){
  document.getElementById("journalView").style.display="none";
  document.getElementById("cryptoView").style.display="block";
  document.getElementById("cryptoBtn").classList.add("active");
  document.getElementById("journalBtn").classList.remove("active");
  document.getElementById("monthPnl").style.display="none";
  await loadCrypto();
}

async function loadCrypto(){
  const status=document.getElementById("cryptoStatus");
  const grid=document.getElementById("cryptoGrid");
  status.style.display="block";
  status.textContent="Loading crypto prices...";
  grid.innerHTML="";
  try{
    const url="https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false&price_change_percentage=24h,7d";
    const res=await fetch(url);
    if(!res.ok) throw new Error();
    const data=await res.json();
    status.style.display="none";
    grid.innerHTML=data.map(c=>{
      const move24=c.price_change_percentage_24h||0;
      const move7=c.price_change_percentage_7d_in_currency||0;
      return `
        <div class="crypto-card" onclick="loadCryptoChart('${c.id}','${c.name.replace(/'/g,"")}')">
          <div class="coin-left">
            <img src="${c.image}" alt="${c.name}">
            <div>
              <div class="coin-name">${c.name}</div>
              <div class="coin-symbol">${c.symbol.toUpperCase()} • Rank #${c.market_cap_rank}</div>
            </div>
          </div>
          <div class="coin-price">
            ${money(c.current_price)}
            <div class="coin-move ${move24>=0?"green":"red"}">24h: ${move24.toFixed(2)}%</div>
            <div class="coin-move ${move7>=0?"green":"red"}">7d: ${move7.toFixed(2)}%</div>
          </div>
        </div>
      `;
    }).join("");
  }catch(e){
    status.textContent="Could not load crypto prices. Try refreshing in a minute.";
  }
}

async function loadCryptoChart(id,name){
  document.getElementById("cryptoChartTitle").textContent=name+" — Last 7 Days";
  document.getElementById("cryptoChartModal").classList.add("show");

  try{
    const res=await fetch(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=7`);
    if(!res.ok) throw new Error();
    const data=await res.json();

    const labels=data.prices.map(p=>{
      const d=new Date(p[0]);
      return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" "+d.toLocaleTimeString("en-US",{hour:"numeric"});
    });

    const prices=data.prices.map(p=>p[1]);

    if(cryptoChartInstance) cryptoChartInstance.destroy();

    cryptoChartInstance=new Chart(document.getElementById("cryptoChart"),{
      type:"line",
      data:{
        labels,
        datasets:[{
          label:name+" Price",
          data:prices,
          borderWidth:3,
          tension:.35,
          pointRadius:0
        }]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:"#e8eef7"}}},
        scales:{
          x:{ticks:{color:"#b8c0d4",maxTicksLimit:7},grid:{color:"rgba(255,255,255,.08)"}},
          y:{ticks:{color:"#b8c0d4",callback:v=>"$"+v.toLocaleString()},grid:{color:"rgba(255,255,255,.08)"}}
        }
      }
    });
  }catch(e){
    document.getElementById("cryptoChartTitle").textContent="Could not load chart";
  }
}

function closeCryptoChart(){
  document.getElementById("cryptoChartModal").classList.remove("show");
}

render();
</script>
</body>
</html>
