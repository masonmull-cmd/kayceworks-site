<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Journal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:
    linear-gradient(rgba(10,15,25,.52),rgba(10,15,25,.62)),
    url("https://cdn.discordapp.com/attachments/896516201528848475/1504715919669334106/conifer-forest-in-the-fog-with-sun-peeking-through-trees.png?ex=6a07ff67&is=6a06ade7&hm=7d033e7fd18e7b52253394bae7c4820ea7982027200df4bbf2d0ccf685fc0b35&");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#e8eef7;
  min-height:100vh;
  padding:22px;
  transition:background .4s ease;
}

.hidden{display:none!important}

.container{
  max-width:1300px;
  margin:auto;
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.card,
.calendar-head,
.day,
table,
.modal-card,
.login-card,
.home-card,
.crypto-card,
.stat{
  background:rgba(20,25,38,.42);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.login-card,
.home-card{
  width:100%;
  max-width:440px;
  border-radius:28px;
  padding:36px;
}

.logo,
h1{
  font-size:42px;
  font-weight:900;
}

.subtitle{
  color:#b8c0d4;
  margin:12px 0 24px;
  line-height:1.5;
}

.input{
  width:100%;
  padding:15px;
  margin-bottom:14px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,.1);
  color:white;
  font-size:16px;
}

.btn,
.nav button{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
}

.btn.main,
.btn.active{
  background:#14d8a6;
  color:#07110e;
  font-weight:900;
}

.error{
  color:#ff5f7e;
  margin-top:12px;
  text-align:center;
}

.home-buttons{
  display:grid;
  gap:14px;
}

.home-btn{
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
  transition:.2s;
}

.home-btn:hover,
.day:hover,
.crypto-card:hover,
.stat:hover{
  transform:scale(1.015);
}

.month-pnl{
  margin-top:8px;
  font-size:34px;
  font-weight:900;
}

.green{color:#14d8a6}
.red{color:#ff5f7e}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.top-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.dashboard,
.cs2-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin:24px 0;
}

.card{
  border-radius:22px;
  padding:22px;
}

.label{
  color:#b8c0d4;
  font-size:15px;
  margin-bottom:10px;
}

.value{
  font-size:38px;
  font-weight:900;
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:22px;
  padding:18px 22px;
  margin-bottom:12px;
}

.month-title{
  font-size:32px;
  font-weight:900;
}

.nav{
  display:flex;
  gap:10px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekday{
  text-align:center;
  padding:10px;
  color:#d2d9e6;
  font-weight:800;
}

.day{
  min-height:145px;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  transition:.2s;
}

.day.win{
  background:rgba(20,216,166,.18);
  border:1px solid rgba(20,216,166,.45);
}

.day.loss{
  background:rgba(255,95,126,.18);
  border:1px solid rgba(255,95,126,.4);
}

.day-num{
  text-align:right;
  font-size:15px;
  margin-bottom:18px;
  font-weight:700;
}

.day-pnl{
  font-size:18px;
  font-weight:900;
}

.day-trades{
  font-size:14px;
  color:#d4d9e5;
}

.muted{
  opacity:.35;
}

.trades-table{
  margin-top:24px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  border-radius:22px;
  overflow:hidden;
}

th,
td{
  padding:16px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,.08);
}

th{
  color:#b8c0d4;
  font-size:14px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  justify-content:center;
  align-items:center;
  z-index:100;
  padding:16px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:95%;
  max-width:800px;
  border-radius:22px;
  padding:24px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  background:none;
  border:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.trade{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
  line-height:1.7;
}

.crypto-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:18px;
}

.crypto-card{
  border-radius:20px;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.coin-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.coin-left img{
  width:38px;
}

.coin-name{
  font-weight:900;
  font-size:18px;
}

.coin-symbol{
  color:#b8c0d4;
  font-size:13px;
}

.coin-price{
  text-align:right;
  font-weight:900;
}

.section-title{
  font-size:28px;
  font-weight:900;
  margin:26px 0 14px;
}

.stat-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.stat{
  border-radius:18px;
  padding:18px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(20,216,166,.18);
  color:#14d8a6;
  font-size:12px;
  font-weight:900;
}

@media(max-width:900px){

  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .dashboard,
  .cs2-grid,
  .stat-list{
    grid-template-columns:1fr 1fr;
  }

  .calendar,
  .crypto-grid{
    grid-template-columns:1fr;
  }

  .weekday{
    display:none;
  }

}

@media(max-width:600px){

  .dashboard,
  .cs2-grid,
  .stat-list{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div id="loginPage" class="center">

  <div class="login-card">

    <div class="logo">Journal</div>

    <div class="subtitle">
      Track results, Review mistakes. Build consistency.
    </div>

    <input id="username" class="input" placeholder="Username">

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button class="btn main" onclick="login()">
      Sign In
    </button>

    <div id="error" class="error"></div>

  </div>

</div>

<script>

function setMenuBackground(){

  document.body.style.background = `
    linear-gradient(rgba(10,15,25,.52),rgba(10,15,25,.62)),
    url("https://cdn.discordapp.com/attachments/896516201528848475/1504715919669334106/conifer-forest-in-the-fog-with-sun-peeking-through-trees.png?ex=6a07ff67&is=6a06ade7&hm=7d033e7fd18e7b52253394bae7c4820ea7982027200df4bbf2d0ccf685fc0b35&")
  `;

  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundAttachment = "fixed";

}

function setProfile1Background(){

  document.body.style.background = `
    linear-gradient(rgba(10,15,25,.48),rgba(10,15,25,.58)),
    url("https://cdn.discordapp.com/attachments/864511785838182410/1504606086081286155/IMG_5684.jpg?ex=6a07991d&is=6a06479d&hm=0d9b9101e30085c5bccfd7129478ee550c210ea0cb50fc1ba572f81e87a4ac46&")
  `;

  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundAttachment = "fixed";

}

function setProfile3Background(){

  document.body.style.background = `
    linear-gradient(rgba(10,15,25,.35),rgba(10,15,25,.55)),
    url("https://cdn.discordapp.com/attachments/896516201528848475/1504704890830852126/uuunldy3tywa1.png?ex=6a07f522&is=6a06a3a2&hm=34481a11acb1f40b805e1ad551bdb395e7b37bb555d95fdce83f2f15839f43a2&")
  `;

  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundAttachment = "fixed";

}

function login(){

  const u =
    document.getElementById("username").value.trim();

  const p =
    document.getElementById("password").value.trim();

  if(u === "1" && p === "1"){

    setProfile1Background();

    alert("Profile #1 Loaded");

  }
  else if(u === "3" && p === "3"){

    setProfile3Background();

    alert("Profile #3 Loaded");

  }
  else{

    document.getElementById("error").textContent =
      "Incorrect username or password";

  }

}

</script>
</body>
</html>
