<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P&L Journal</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:
    linear-gradient(rgba(10,15,25,.45), rgba(10,15,25,.6)),
    url("https://cdn.discordapp.com/attachments/864511785838182410/1504606086081286155/IMG_5684.jpg?ex=6a07991d&is=6a06479d&hm=0d9b9101e30085c5bccfd7129478ee550c210ea0cb50fc1ba572f81e87a4ac46&");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  min-height:100vh;
  color:white;
}

.hidden{
  display:none !important;
}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.login-card,
.home-card{
  width:100%;
  max-width:420px;
  background:rgba(20,25,38,.45);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:38px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.logo{
  font-size:42px;
  font-weight:900;
  margin-bottom:10px;
  text-align:center;
}

.subtitle{
  text-align:center;
  color:#b8c0d4;
  margin-bottom:28px;
  line-height:1.5;
}

.input{
  width:100%;
  padding:16px;
  margin-bottom:16px;
  border:none;
  outline:none;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:16px;
}

.input::placeholder{
  color:#b8c0d4;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#14d8a6;
  color:#07110e;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:scale(1.02);
}

.error{
  margin-top:14px;
  color:#ff5f7e;
  text-align:center;
  font-size:14px;
}

.home-buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:22px;
}

.home-btn{
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:white;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.home-btn:hover{
  transform:scale(1.02);
  border-color:#14d8a6;
}

.home-btn-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:4px;
}

.home-btn-sub{
  color:#b8c0d4;
  font-size:14px;
}

.stats{
  margin-top:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat{
  background:rgba(255,255,255,.06);
  padding:16px;
  border-radius:16px;
}

.stat-label{
  color:#b8c0d4;
  font-size:13px;
  margin-bottom:6px;
}

.stat-value{
  font-size:24px;
  font-weight:900;
}

.green{
  color:#14d8a6;
}

</style>
</head>

<body>

<div id="loginPage" class="center">

  <div class="login-card">

    <div class="logo">P&L Journal</div>

    <div class="subtitle">
      Track trades. Review mistakes. Build consistency.
    </div>

    <input
      id="username"
      class="input"
      placeholder="Username"
      autocomplete="off"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button class="btn" onclick="login()">
      Sign In
    </button>

    <div id="error" class="error"></div>

  </div>

</div>

<div id="homePage" class="center hidden">

  <div class="home-card">

    <div class="logo">P&L Journal</div>

    <div class="subtitle">
      Your personal trading dashboard.
    </div>

    <div class="home-buttons">

      <div class="home-btn" onclick="goToJournal()">
        <div class="home-btn-title">Journal</div>
        <div class="home-btn-sub">
          View calendar, trades, and performance
        </div>
      </div>

      <div class="home-btn" onclick="goToCrypto()">
        <div class="home-btn-title">Crypto</div>
        <div class="home-btn-sub">
          Track top crypto prices and charts
        </div>
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">Total P&L</div>
        <div class="stat-value green">$2,553</div>
      </div>

      <div class="stat">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value">61%</div>
      </div>

    </div>

  </div>

</div>

<script>

const USERNAME = "1";
const PASSWORD = "1";

function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(username === USERNAME && password === PASSWORD){

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("homePage")
      .classList.remove("hidden");

  }else{

    document
      .getElementById("error")
      .textContent = "Incorrect username or password";

  }

}

function goToJournal(){

  window.location.href = "journal.html";

}

function goToCrypto(){

  window.location.href = "crypto.html";

}

</script>

</body>
</html>
